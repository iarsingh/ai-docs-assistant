apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-docs-assistant
  labels:
    app: ai-docs-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-docs-assistant
  template:
    metadata:
      labels:
        app: ai-docs-assistant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ai-docs-assistant:local
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ai-docs-assistant
spec:
  selector:
    app: ai-docs-assistant
  ports:
    - port: 80
      targetPort: 8080
